# @package _global_
_target_: versatil.configs.main.MainConfig

defaults:
  - /task: base
  - /policy: base
  - /experiment: default
  - /task/dataset_schema: endoscope_guidance_phantom_5hz_lerobot
  - /task/dataloader: endoscope_guidance
  - /task/action_space: camera_frame_position_and_roll_precomputed_lerobot
  - /task/observation_space: stereo_rgb_language_camera_frame_position_and_roll_lerobot
  - /training: default
  - /policy/decoder: pi0_fast
  - /policy/algorithm: behavioral_cloning
  - /policy/loss: token_ce
  - _self_

task:
  observation_horizon: 5
  prediction_horizon: 10
  dataloader:
    batch_size: 1
    kinematics_norm_type: ${kinematics_norm_type:GAUSSIAN}
    tokenization:
      tokenize_observations: true
      tokenize_actions: true
      observation_tokenizer:
        tokenizer_model: ${paligemma_model:PALIGEMMA2_3B_224}
        observation_keys:
          - ${obs_key:LANGUAGE}
          - ${proprio_key:CAMERA_FRAME_CARTESIAN_TIP_POS}
          - ${proprio_key:RELATIVE_PIVOT_ROLL}
        bin_continuous_data: true
        max_token_len: 96
        raw_text: false
        padding_strategy: ${token_padding:MAX_LENGTH}
      action_tokenizer:
        action_discretizer:
          type: ${action_discretizer:FAST}
          use_pretrained: false
        token_id_mapping:
          type: ${action_token_id_mapping:LANGUAGE_VOCABULARY}
          language_tokenizer_model: ${paligemma_model:PALIGEMMA2_3B_224}
          num_special_tokens_to_skip: 128
        max_token_len: 128

experiment:
  precision: ${precision:BF16_MIXED}
  checkpoint_folder: ${checkpoint_dir:endoscope_guidance_phantom_5hz}
  checkpoint_every: 5

training:
  num_epochs: 100
  gradient_accumulate_every: 64
  early_stopping_patience: null
  clip_gradient_norm: true
  clip_max_norm: 1.0
  lr_schedule: "cosine_with_min_lr"
  lr_warmup_steps: 1000
  lr_scheduler_kwargs:
    min_lr: 2.5e-6
  optimizer:
    lr: 2.5e-5
    betas: [0.9, 0.95]
    weight_decay: 0.01
    param_groups: []

policy:
  _target_: versatil.models.policy.Policy
  observation_space: ${task.observation_space}
  action_space: ${task.action_space}
  prediction_horizon: ${task.prediction_horizon}
  observation_horizon: ${task.observation_horizon}
  device: ${experiment.device}
  encoding_pipeline:
    _target_: versatil.models.encoding.pipeline.EncodingPipeline
    encoders: {}
    observation_space: ${task.observation_space}
    fusion_stages: []
  decoder:
    max_seq_len: 4096
    vlm_backbone:
      input_keys:
        - ${cameras:LEFT}
        - ${cameras:RIGHT}
  loss:
    loss_modules:
      token_loss:
        label_smoothing: 0.0

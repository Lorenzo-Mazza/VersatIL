# @package _global_
_target_: versatil.configs.main.MainConfig

defaults:
  - /task: base
  - /policy: base
  - /experiment: default
  - /task/dataset_schema: endoscope_guidance_phantom_5hz
  - /task/dataloader: endoscope_guidance
  - /task/action_space: camera_frame_position_and_roll
  - /task/observation_space: stereo_rgb_language_camera_frame_position_and_roll
  - /training: default
  - /policy/encoding_pipeline: camera_frame_position_and_roll
  - /policy/decoder: smolvla_decoder
  - /policy/algorithm: flow_matching
  - /policy/loss: regression_camera_frame_position_and_roll
  - _self_

task:
  observation_horizon: 5
  prediction_horizon: 10
  dataloader:
    batch_size: 1
    kinematics_norm_type: ${kinematics_norm_type:GAUSSIAN}
    tokenization:
      observation_tokenizer:
        tokenizer_model: ${smolvlm_model:SMOLVLM_256M}
        max_token_len: 48
        padding_strategy: ${token_padding:MAX_LENGTH}

experiment:
  precision: ${precision:FP32}
  checkpoint_folder: ${checkpoint_dir:endoscope_guidance_phantom_5hz}
  checkpoint_every: 5

training:
  num_epochs: 100
  gradient_accumulate_every: 64
  early_stopping_patience: null
  clip_gradient_norm: true
  clip_max_norm: 10.0
  lr_schedule: cosine
  lr_warmup_steps: 1000
  optimizer:
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 1.0e-10
    param_groups: []

policy:
  _target_: versatil.models.policy.Policy
  observation_space: ${task.observation_space}
  action_space: ${task.action_space}
  prediction_horizon: ${task.prediction_horizon}
  observation_horizon: ${task.observation_horizon}
  device: ${experiment.device}
  decoder:
    input_keys:
      - camera_frame_proprio
    proprioceptive_feature_key: camera_frame_proprio
    action_heads:
      joint_action:
        input_dimension: 288
    vlm_backbone:
      model_name: ${smolvlm_model:SMOLVLM_256M}
      lora_config: null
      input_keys:
        - ${cameras:LEFT}
        - ${cameras:RIGHT}
  loss:
    loss_modules:
      regression_loss:
        action_keys:
          - ${proprio_key:CAMERA_FRAME_CARTESIAN_TIP_POS}
          - ${proprio_key:RELATIVE_PIVOT_ROLL}
        mse_weight: 1.0
        l1_weight: 0.0
      trajectory_length:
        action_key: ${proprio_key:CAMERA_FRAME_CARTESIAN_TIP_POS}

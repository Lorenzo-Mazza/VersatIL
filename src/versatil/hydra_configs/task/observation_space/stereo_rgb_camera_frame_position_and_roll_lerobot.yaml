defaults:
  - base

_target_: versatil.data.task.ObservationSpace

observations_metadata:
  ${cameras:LEFT}:
    _target_: versatil.data.metadata.RGBCameraMetadata
    camera_key: ${raw_camera:LEFT_CAMERA_TSO_LEROBOT}
    dtype: uint8
    image_width: 480
    image_height: 270

  ${cameras:RIGHT}:
    _target_: versatil.data.metadata.RGBCameraMetadata
    camera_key: ${raw_camera:RIGHT_CAMERA_TSO_LEROBOT}
    dtype: uint8
    image_width: 480
    image_height: 270

  ${proprio_key:CAMERA_FRAME_CARTESIAN_TIP_POS}:
    _target_: versatil.data.metadata.PositionObservationMetadata
    frame: ${coordinate_system:CAMERA}
    raw_data_column_keys: [observation.state]
    dtype: float32
    dimension: 3
    needs_normalization: true
    slice_start: 0
    slice_end: 3

  ${proprio_key:RELATIVE_PIVOT_ROLL}:
    _target_: versatil.data.metadata.OrientationObservationMetadata
    frame: ${coordinate_system:UNKNOWN}
    orientation_representation: ${orientation:ROLL}
    raw_data_column_keys: [observation.state]
    dtype: float32
    dimension: 1
    needs_normalization: true
    slice_start: 3
    slice_end: 4

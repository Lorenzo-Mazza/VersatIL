defaults:
  - base

_target_: versatil.data.raw.zarr_meta.DatasetMetadata

observations:
  ${cameras:LEFT}:
    _target_: versatil.data.metadata.RGBCameraMetadata
    camera_key: ${raw_camera:LEFT_CAMERA_TSO_LEROBOT}
    dtype: uint8
    image_width: 480
    image_height: 270

  ${cameras:RIGHT}:
    _target_: versatil.data.metadata.RGBCameraMetadata
    camera_key: ${raw_camera:RIGHT_CAMERA_TSO_LEROBOT}
    dtype: uint8
    image_width: 480
    image_height: 270

  ${obs_key:LANGUAGE}:
    _target_: versatil.data.metadata.ObservationMetadata
    raw_data_column_keys: [task]
    dtype: str
    dimension: 1
    is_numerical: false
    needs_normalization: false

  ${proprio_key:CAMERA_FRAME_CARTESIAN_TIP_POS}:
    _target_: versatil.data.metadata.PositionObservationMetadata
    frame: ${coordinate_system:CAMERA}
    raw_data_column_keys: [observation.state]
    dtype: float32
    dimension: 3
    needs_normalization: true
    slice_start: 0
    slice_end: 3

  ${proprio_key:RELATIVE_PIVOT_ROLL}:
    _target_: versatil.data.metadata.OrientationObservationMetadata
    frame: ${coordinate_system:UNKNOWN}
    orientation_representation: ${orientation:ROLL}
    raw_data_column_keys: [observation.state]
    dtype: float32
    dimension: 1
    needs_normalization: true
    slice_start: 3
    slice_end: 4

precomputed_actions:
  ${action_component:POSITION}:
    _target_: versatil.data.metadata.PositionActionMetadata
    frame: ${coordinate_system:CAMERA}
    raw_data_column_keys: [action]
    dtype: float32
    storage_dimension: 4
    prediction_dimension: 3
    needs_normalization: true
    slice_start: 0
    slice_end: 3
    computation_method: ${action_computation:DELTA}

  ${action_component:ORIENTATION}:
    _target_: versatil.data.metadata.OrientationActionMetadata
    frame: ${coordinate_system:UNKNOWN}
    orientation_representation: ${orientation:ROLL}
    raw_data_column_keys: [action]
    dtype: float32
    storage_dimension: 4
    prediction_dimension: 1
    needs_normalization: true
    slice_start: 3
    slice_end: 4
    computation_method: ${action_computation:DELTA}

  ${tso_obs_key:PHASE_LABEL}:
    _target_: versatil.data.metadata.PrecomputedActionMetadata
    raw_data_column_keys: [task_phase]
    dtype: int64
    storage_dimension: 1
    prediction_dimension: 6
    is_numerical: false
    needs_normalization: false
